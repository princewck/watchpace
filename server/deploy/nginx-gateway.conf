limit_req_zone $binary_remote_addr zone=familytv_gateway:10m rate=10r/s;
log_format familytv_safe '$remote_addr [$time_local] $request_method $status $body_bytes_sent $request_time';
server {
 listen 80;
 listen [::]:80;
 server_name tv.chengkai.wang;
 location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
 location / { return 301 https://tv.chengkai.wang$request_uri; }
}
server {
 listen 443 ssl;
 listen [::]:443 ssl;
 server_name tv.chengkai.wang;
 ssl_certificate /etc/letsencrypt/live/tv.chengkai.wang/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/tv.chengkai.wang/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_cache shared:FamilyTVTLS:10m;
 ssl_session_timeout 1d;
 server_tokens off;
 client_max_body_size 32k;
 client_body_timeout 10s;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 access_log /var/log/nginx/tv-parent-control.access.log familytv_safe;
 error_log /var/log/nginx/tv-parent-control.error.log warn;
 location ^~ /downloads/ {
  return 302 https://familytv-api.princewck.workers.dev$request_uri;
 }
 location / {
  limit_req zone=familytv_gateway burst=50 nodelay;
  limit_req_status 429;
  proxy_pass http://127.0.0.1:3001;
  proxy_http_version 1.1;
  proxy_set_header Host tv.chengkai.wang;
  proxy_set_header Connection "";
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_connect_timeout 2s;
  proxy_read_timeout 30s;
  proxy_send_timeout 10s;
 }
}
