name: FamilyTV
options:
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, ko, ja]
  bundleIdPrefix: wang.chengkai
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 27
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FamilyTV:
    type: application
    platform: iOS
    preBuildScripts:
      - name: Verify installer release links
        script: /usr/bin/env python3 "$SRCROOT/../scripts/check-distribution.py" --packaged-only
        basedOnDependencyAnalysis: false
        inputFileLists: ["$(SRCROOT)/scripts/distribution-inputs.xcfilelist"]
    sources: [App, Core, Resources]
    info:
      path: AppInfo.plist
      properties:
        FamilyTVServiceOrigin: $(FAMILYTV_SERVICE_ORIGIN)
        NSLocalNetworkUsageDescription: 用于发现并加密连接你配对的家庭电视，直接发送暂停、额度和观看规则。拒绝后仍可使用云端。
        NSCameraUsageDescription: 扫描另一位家长分享的电视二维码，申请共同管理这台电视。不会保存或上传相机画面。
        CFBundleURLTypes:
          - CFBundleURLName: wang.chengkai.familytv.share
            CFBundleURLSchemes: [watchpace]
        NSBonjourServices: ["_familytv._tcp"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wang.chengkai.familytv
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 观有度
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          FAMILYTV_SERVICE_ORIGIN: https://tv.chengkai.wang
        Release:
          FAMILYTV_SERVICE_ORIGIN: https://tv.chengkai.wang
  FamilyTVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [FamilyTV.storekit]
      - path: Tests/FamilyTV.storekit
        buildPhase: resources
    dependencies:
      - target: FamilyTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  FamilyTVUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: FamilyTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FamilyTV:
    run:
      storeKitConfiguration: Tests/FamilyTV.storekit
    build:
      targets:
        FamilyTV: all
    test:
      targets: [FamilyTVTests, FamilyTVUITests]
