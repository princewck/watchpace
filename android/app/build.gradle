plugins { id 'com.android.application' }
android {
    namespace 'org.example.tvchallenge'
    compileSdk 34
    defaultConfig { applicationId 'org.example.tvchallenge'; minSdk 26; targetSdk 34; versionCode 18; versionName '5.0.12'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    // The bootstrap installer is pinned separately from the protected OTA channel.
    def otaCode = providers.gradleProperty('otaVersionCode')
    def otaName = providers.gradleProperty('otaVersionName')
    if (otaCode.isPresent() && otaName.isPresent()) {
        defaultConfig.versionCode = otaCode.get().toInteger()
        defaultConfig.versionName = otaName.get()
    }
    signingConfigs {
        release {
            if (System.getenv('TV_RELEASE_STORE_FILE')) {
                storeFile file(System.getenv('TV_RELEASE_STORE_FILE'))
                storePassword System.getenv('TV_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('TV_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('TV_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
