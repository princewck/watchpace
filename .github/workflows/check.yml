name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
        working-directory: server
      - run: npm run lint && npm test && npm run build:node && npm run format:check
        working-directory: server
      - run: python3 scripts/check-distribution.py --fetch --online
      - run: python3 scripts/test-distribution.py
      - run: python3 scripts/check-project.py
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: python3 scripts/check-distribution.py --fetch
      - run: xcodegen generate --spec ios/project.yml
      - run: xcodebuild -project ios/FamilyTV.xcodeproj -scheme FamilyTV -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: bash android/build.sh
      - run: gradle -p android --no-daemon :app:assembleDebugAndroidTest
